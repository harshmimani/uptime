<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Uptime icon: the rotation (Upper A, Lower A, Upper B, Lower B) as four arcs, three done in
       green and the next one in off-white with the dial's marker, like the dial on Home. Source for every icon size:
       tests/browser/make-icons.mjs renders the PNGs from this file. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#14281D"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="rotate(-135 256 256)" fill="none" stroke-width="46" stroke-linecap="round">
    <!-- r = 148, circumference 929.9; each quarter 232.5, drawn 172.5 with a 60 gap (caps fill 46 of it) -->
    <circle cx="256" cy="256" r="148" stroke="#29BA74" stroke-dasharray="172.5 757.4" stroke-dashoffset="-30"/>
    <circle cx="256" cy="256" r="148" stroke="#F2F5F3" stroke-dasharray="172.5 757.4" stroke-dashoffset="-262.5"/>
    <circle cx="256" cy="256" r="148" stroke="#29BA74" stroke-dasharray="172.5 757.4" stroke-dashoffset="-495"/>
    <circle cx="256" cy="256" r="148" stroke="#29BA74" stroke-dasharray="172.5 757.4" stroke-dashoffset="-727.5"/>
  </g>
  <circle cx="404" cy="256" r="13" fill="#0B0D0C"/>
</svg>
