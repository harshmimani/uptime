<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0C">
<meta name="color-scheme" content="dark">
<meta name="description" content="Uptime: your next session, your week and one number worth knowing. Start in one tap.">
<title>Uptime</title>
<script>
/* A workout in progress opens straight to it and skips Home (CLAUDE.md). Runs before
   anything else loads, so nothing of Home is painted first. Not on a back/forward
   navigation, so the back button still reaches Home (which then offers Resume). */
try {
  var d = JSON.parse(localStorage.getItem("uptime2") || "null"), n = new Date(),
      t = n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2),
      nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
  if (d && d.active && d.active.date === t && !(nav && nav.type === "back_forward")) location.replace("workout.html");
} catch (e) {}
</script>
<style>@view-transition { navigation: auto; }</style>
