<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- wf:head-end -->
<title>Uptime Wireframes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three columns on a laptop (flows | phone | notes), stacked on a phone.
   Low fidelity on purpose: greys only, one "hot" colour for tappable areas, one flag colour. */
:root {
  --bg: #eceef1; --panel: #ffffff; --ink: #1c1f23; --muted: #5a616b; --line: #c6ccd3;
  --ph: #dfe3e8; --ph-ink: #4d545d; --phone: #f7f8fa; --frame: #2a2d32;
  --btn: #2a2e34; --btn-ink: #ffffff; --btn2: #6b727c; --hot: #3d6fb6; --flag: #a4500f; --flag-bg: #fbeadb;
  --scrim: rgba(20, 22, 26, .45);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171a; --panel: #1e2125; --ink: #e6e8eb; --muted: #9ba2ab; --line: #3a3f46;
  --ph: #2b2f35; --ph-ink: #b2b8c0; --phone: #101214; --frame: #3a3e45;
  --btn: #d9dde2; --btn-ink: #15171a; --btn2: #8c939c; --hot: #7fa8e6; --flag: #f0a463; --flag-bg: #3a2a1c;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1e2125; --ink: #e6e8eb; --muted: #9ba2ab; --line: #3a3f46;
  --ph: #2b2f35; --ph-ink: #b2b8c0; --phone: #101214; --frame: #3a3e45;
  --btn: #d9dde2; --btn-ink: #15171a; --btn2: #8c939c; --hot: #7fa8e6; --flag: #f0a463; --flag-bg: #3a2a1c;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 250px 380px minmax(0, 1fr); gap: 24px; max-width: 1280px; margin: 0 auto; align-items: start; }
.title { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.title h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.title p { margin: 0; color: var(--muted); }
.title label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }

/* Flow list */
.flows { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 16px; }
.flows .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
.flowbtn { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: baseline; }
.flowbtn:hover { background: var(--panel); }
.flowbtn[aria-current="true"] { background: var(--panel); border-color: var(--line); font-weight: 600; }
.flowbtn .n { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.flowbtn .f { font-size: 11px; color: var(--flag); font-weight: 600; }

/* Stage */
.stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone { width: 360px; max-width: 100%; height: min(760px, calc(100dvh - 150px)); min-height: 600px; border: 10px solid var(--frame); border-radius: 38px;
  background: var(--phone); position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.phone.thumb::after { content: "Thumb zone (bottom third)"; position: absolute; inset: auto 0 0 0; height: 34%; pointer-events: none; z-index: 30;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--hot);
  border-top: 2px dashed var(--hot); background: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--hot) 9%, transparent) 10px 20px); }
.stepper { display: flex; gap: 8px; align-items: center; width: 360px; max-width: 100%; justify-content: space-between; }
.stepper button { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper span { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }

/* Notes */
.notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.panel h2 { font-size: 16px; margin: 0 0 4px; text-wrap: balance; }
.panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
.panel h3:first-child { margin-top: 0; }
.panel p { margin: 0 0 6px; max-width: 62ch; }
.panel ul { margin: 4px 0 0; padding-left: 18px; }
.panel li { margin: 2px 0; }
.steps { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 2px; }
.steps button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer;
  display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: baseline; }
.steps button:hover { background: var(--bg); }
.steps button[aria-current="true"] { background: var(--bg); font-weight: 600; }
.steps .k { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.steps .via { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.steps .t { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
.pill.ok { color: var(--muted); }
.pill.flag { color: var(--flag); background: var(--flag-bg); border-color: transparent; }
.flagbox { background: var(--flag-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.flagbox b { color: var(--flag); }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ---------- Inside the phone ---------- */
.sb { display: flex; justify-content: space-between; padding: 8px 18px 2px; font: 600 11px var(--mono); color: var(--muted); flex: none; }
.top { padding: 6px 16px 8px; flex: none; }
.mid { flex: 1; overflow: auto; padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.bottom { padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.label { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.h3 { font-size: 15px; font-weight: 600; }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.ph { background: var(--ph); color: var(--ph-ink); border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: 11px; padding: 6px; flex: none; }
.ring { width: 64px; height: 64px; border-radius: 50%; font-weight: 700; font-size: 12px; }
.block { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.rowline { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
.stat .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.card { margin: 0 10px; border: 2px solid var(--ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--phone); flex: none; }
.note { background: var(--ph); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
.btn { min-height: 48px; border-radius: 12px; border: 0; padding: 0 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--btn); color: var(--btn-ink); min-height: 60px; font-size: 17px; width: 100%; }
.btn.sec { background: transparent; border: 1.5px solid var(--btn2); }
.btn.wide { width: 100%; }
.btn.tall { min-height: 60px; font-size: 17px; }
.btn.textonly { background: transparent; border: 0; text-decoration: underline; text-underline-offset: 3px; min-height: 48px; padding: 0 6px; font-weight: 500; }
.btn[disabled] { opacity: .45; }
.chips { display: flex; gap: 6px; }
.chip { min-height: 48px; min-width: 48px; flex: 1; border-radius: 10px; border: 1.5px solid var(--btn2); background: transparent; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--phone); border-color: var(--ink); }
.stepperk { display: grid; grid-template-columns: 48px 1fr 48px; gap: 6px; align-items: center; }
.stepperk .val { text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepperk .val small { font-size: 12px; color: var(--muted); font-weight: 500; }
.sq { min-height: 48px; border-radius: 10px; border: 1.5px solid var(--btn2); background: transparent; font-size: 20px; cursor: pointer; }
.whead { padding: 6px 16px 10px; flex: none; display: flex; flex-direction: column; gap: 4px; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--ph); border: 1px solid var(--line); }
.segs i.d { background: var(--ink); border-color: var(--ink); }
.segs i.c { background: var(--btn2); border-color: var(--btn2); }
.logged { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.logged div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.timer { font-size: 56px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1; }
.timer.over { font-size: 26px; padding: 14px 0; }
.restbox { border: 2px solid var(--ink); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: absolute; left: 12px; right: 12px; bottom: var(--toast-bottom, 190px); background: var(--ink); color: var(--phone); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; z-index: 20;
  display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.toast u { font-weight: 700; text-underline-offset: 2px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); flex: none; }
.tab { min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); }
.tab::before { content: ""; width: 18px; height: 18px; border-radius: 5px; border: 1.5px dashed var(--muted); }
.tab.on { color: var(--ink); font-weight: 700; }
.tab.on::before { border-style: solid; border-color: var(--ink); background: var(--ph); }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; border-radius: 99px; border: 1.5px solid var(--btn2); background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; }
.switch .knob { width: 30px; height: 18px; border-radius: 99px; background: var(--ph); border: 1.5px solid var(--btn2); position: relative; }
.switch .knob::after { content: ""; position: absolute; top: 1px; left: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--btn2); }
.switch.on { background: var(--ink); color: var(--phone); border-color: var(--ink); }
.switch.on .knob { background: var(--phone); }
.switch.on .knob::after { left: 13px; background: var(--ink); }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 10; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--phone); border-radius: 18px 18px 0 0; z-index: 11; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px; max-height: 86%; overflow: auto; }
.sheet::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; margin-bottom: 4px; }
.opt { text-align: left; border: 1.5px solid var(--btn2); background: transparent; border-radius: 12px; padding: 10px 12px; min-height: 56px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.opt b { font-size: 15px; }
.opt span { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--btn2); border-radius: 10px; overflow: hidden; }
.seg span { min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
.seg span.on { background: var(--ink); color: var(--phone); }
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--ink); }
.lock { background: var(--frame); color: #eef0f2; }
.lock .sb { color: #b7bcc3; }
.lock .clock { font-size: 64px; font-weight: 300; text-align: center; margin-top: 60px; font-variant-numeric: tabular-nums; }
.tag { align-self: flex-start; font-size: 11px; font-weight: 600; border: 1px solid var(--btn2); border-radius: 99px; padding: 2px 8px; }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { border-bottom: 1px solid var(--line); padding-bottom: 8px; font-size: 13px; }
.list li b { display: block; font-size: 14px; }
.dim { opacity: .9; }
.banner { margin: 0 16px 6px; padding: 4px 4px 4px 12px; border: 1.5px solid var(--ink); border-radius: 12px; font-weight: 600; font-size: 13px; flex: none; }

/* Tappable highlight */
.showhot .screen [data-go] { outline: 2px dashed var(--hot); outline-offset: 2px; }
.showhot .screen .sheet [data-go], .showhot .screen .toast [data-go] { outline-offset: 0; }

/* Signature transition (low-fi stand-in for the real one) */
::view-transition-group(card) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
.fade-in { animation: fade .22s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }

@media (max-width: 1080px) {
  .app { grid-template-columns: 380px minmax(0, 1fr); }
  .flows { grid-column: 1 / -1; position: static; flex-direction: row; flex-wrap: wrap; }
  .flows .lbl { width: 100%; }
  .flowbtn { grid-template-columns: auto auto auto; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .phone { width: 100%; }
}
</style>
<!-- wf:body-start -->
</head>
<body>

<div class="app">
  <header class="title">
    <h1>Uptime wireframes · v0.2</h1>
    <p>Low fidelity. Grey boxes are placeholders; the copy is real. Click the dashed controls, or use ← →.</p>
    <label><input type="checkbox" id="hotToggle" checked> Show tappable</label>
    <label><input type="checkbox" id="thumbToggle"> Show thumb zone</label>
  </header>

  <nav class="flows" id="flows" aria-label="Flows"></nav>

  <main class="stage">
    <div class="phone" id="phone"><div class="screen" id="screen" aria-live="polite"></div></div>
    <div class="stepper">
      <button id="prev" type="button">← Back</button>
      <span id="stepLabel"></span>
      <button id="next" type="button">Next →</button>
    </div>
  </main>

  <section class="notes" id="notes" aria-label="Notes"></section>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const sb = (t = "07:42") => `<div class="sb" aria-hidden="true"><span>${t}</span><span>5G · 82%</span></div>`;
const TABGO = { Home: "home", Progress: "", Plan: "plan" };
const tabs = (a = "Home") => `<nav class="tabs" aria-label="Tabs">${["Home", "Progress", "Plan"].map(t => `<span class="tab ${t === a ? "on" : ""}" ${t !== a && TABGO[t] ? `data-go="${TABGO[t]}"` : ""}>${t}</span>`).join("")}</nav>`;
const toast = (t, bottom) => t ? `<div class="toast" role="status" style="${bottom ? `--toast-bottom:${bottom}px` : ""}">${t}</div>` : "";
const segs = (done, cur, total) => `<div class="segs" aria-label="Exercise ${cur} of ${total}">${Array.from({ length: total }, (_, i) => `<i class="${i < done ? "d" : i === done ? "c" : ""}"></i>`).join("")}</div>`;

// ---------------------------------------------------------------- screen builders
function home(o) {
  return `${sb(o.time)}
  <div class="top row between">
    <div><div class="small muted">${o.date}</div><div class="h2">${o.greet}</div></div>
  </div>
  ${o.busy ? `<div class="banner row between"><span>Busy mode is on</span><button class="btn sec" style="min-height:40px" data-go="home-busy-off">Turn off</button></div>` : ""}
  <div class="mid">
    ${o.suggest ? `<section class="block"><div class="h3">Last two weeks were packed</div><div class="small muted">Busy mode keeps things going with 2–3 shorter full-body sessions and 1 run. Your rotation waits.</div><div class="row"><button class="btn sec grow">Not now</button><button class="btn primary grow" style="min-height:48px;font-size:15px;width:auto" data-go="home-busy">Turn on</button></div></section>` : ""}
    ${o.line ? `<div class="note">${o.line}</div>` : ""}
    <section class="block">
      <div class="row" style="gap:12px">
        <div class="ph ring">${o.ring}</div>
        <div class="grow"><div class="label">Last 7 days</div><div class="h3">${o.level}</div><div class="small muted">${o.levelNote}</div></div>
      </div>
      <div class="rowline"><span>Streak</span><b>${o.streak}</b></div>
    </section>
    ${o.stat ? `<section class="block stat"><div class="label">${o.stat[0]}</div><div class="big">${o.stat[1]}</div><div class="small muted">${o.stat[2]}</div></section>`
             : `<div class="ph" style="height:76px">One standout stat appears here after a few sessions (pull-up level, best 5K, total kg).</div>`}
  </div>
  <section class="card" style="view-transition-name:card">
    <div class="label">${o.eyebrow || "Next up"}</div>
    <div class="h1">${o.title}</div>
    <div class="small muted">${o.meta}</div>
    ${o.note ? `<div class="note">${o.note}</div>` : ""}
    ${o.start ? `<button class="btn primary" data-go="${o.start}" data-vt>${o.startLabel || "Start"}</button>` : ""}
    <div class="row between wrap">
      ${o.or ? `<span class="small muted">${o.or}</span>` : `<span></span>`}
      <button class="btn textonly" data-go="home-sport-sheet">Log something else</button>
    </div>
  </section>
  <div style="height:10px;flex:none"></div>
  ${toast(o.toast, o.toastBottom || 300)}
  ${tabs()}`;
}

function checkin(o) {
  return `${sb()}
  <header class="whead" style="view-transition-name:card">
    <div class="label">${o.session} · ${o.mins}</div>
    <div class="h1">How do you feel today?</div>
    <div class="small muted">Rough switches to the Short version. You can change it any time.</div>
  </header>
  <div class="mid">
    ${o.note ? `<div class="note">${o.note}</div>` : ""}
    <div class="ph" style="height:90px">Today's exercises, as a short list (names only)</div>
    <button class="btn textonly" style="align-self:flex-start" data-go="${o.noGym || ""}">No gym today? Use the no-gym version</button>
  </div>
  <div class="bottom">
    <button class="btn primary" data-go="${o.go}">Good</button>
    <button class="btn primary" data-go="${o.go}">Okay</button>
    <button class="btn sec tall wide" data-go="${o.rough || o.go}">Rough</button>
  </div>`;
}

function setScreen(o) {
  const chips = o.reps ? `<div><div class="label" style="margin-bottom:4px">Reps${o.perSide ? " per side" : ""}</div><div class="chips">${o.reps.map(r => `<button class="chip ${r === o.sel ? "on" : ""}">${r}</button>`).join("")}</div></div>` : "";
  const kg = o.kg != null ? `<div class="stepperk"><button class="sq" aria-label="Less weight">−</button><div class="val num">${o.kg}<small> ${o.kgNote || "kg"}</small></div><button class="sq" aria-label="More weight">+</button></div>` : "";
  const rest = o.rest ? `<div class="restbox">
      <div class="row between"><span class="label">Rest</span><span class="small muted">Next: set ${o.setN} of ${o.of}</span></div>
      <div class="timer num" data-rest>1:45</div>
      <div class="row"><button class="btn sec grow">+15 s</button><button class="btn sec grow" data-go="${o.skipGo}">Skip rest</button></div>
    </div>` : "";
  return `${sb(o.time)}
  <header class="whead" style="view-transition-name:card">
    <div class="row between"><span class="label">${o.session} · ${o.pos}</span><span class="small muted num">${o.elapsed || "12:40"}</span></div>
    ${segs(o.done, o.done, o.total)}
  </header>
  <div class="mid">
    ${o.banner ? `<div class="note">${o.banner}</div>` : ""}
    ${o.warm ? warmCard(o.warm) : ""}
    ${rest}
    ${o.tag ? `<span class="tag">${o.tag}</span>` : ""}
    <div><div class="h2">${o.ex}</div><div class="small muted">${o.cue}</div></div>
    <div class="row between"><span class="h3">Set ${o.setN} of ${o.of}</span><span class="small muted">${o.range}</span></div>
    <div class="small muted">${o.last}</div>
    ${o.hint ? `<div class="note">${o.hint}</div>` : ""}
    ${o.logged && o.logged.length ? `<div class="logged">${o.logged.map(l => `<div><span>${l[0]}</span><span>${l[1]}</span></div>`).join("")}</div>` : ""}
  </div>
  ${toast(o.toast, 262)}
  <div class="bottom">
    ${kg}
    ${chips}
    <div class="row"><button class="btn sec grow" data-go="${o.swapGo || ""}">Swap</button><button class="btn sec grow">All exercises</button></div>
    <button class="btn primary" data-go="${o.logGo}">${o.logLabel}</button>
  </div>
  ${o.sheet || ""}`;
}

      <div class="h2">Log something else</div>
      <div class="seg"><span class="on">Today</span><span>Yesterday</span></div>
      <button class="opt" data-go="home-sport-done"><b>Basketball</b><span>Your sport session · 60 min</span></button>
      <button class="opt" data-go="home-sport-done"><b>Easy run</b><span>Counts as conditioning · 30 min</span></button>
      <button class="opt" data-go="home-sport-done"><b>Bike or incline walk</b><span>Conditioning · 30 min</span></button>
      <button class="opt" data-go="home-sport-done"><b>Stair session</b><span>Conditioning · 20 min</span></button>
      <button class="opt"><b>A run from the plan</b><span>Interval, tempo or 5K check · opens the run screen</span></button>
    </div>` },
  "home-sport-done": { name: "Home · after logging basketball", primary: "Start (Upper A still fits today)",
    why: "The spacing rules apply right away, as a suggestion. Sport plus an Upper session may share a day, so Start stays; had Lower been next, the card would suggest tomorrow.",
    html: () => home({ ...HOME, ring: "4 of 6", levelNote: "Upper A makes it a Good week.",
      note: "Basketball covers this week's sport session. Upper A can still go today, or tomorrow.",
      toast: `<span>Basketball logged · 60 min, today</span><span><u>Edit</u> · <u>Undo</u></span>` }) },
};

// ---------------------------------------------------------------- flows
// taps = taps on the previous screen to get here.
const FLOWS = [
  { id: "onboarding", name: "First-run onboarding", verdict: "3 taps · one-time",
    steps: [["ob1", "Open the app for the first time", 0], ["ob2", "Tap At a gym", 1], ["ob3", "Tap Continue", 1], ["home-first", "Tap Done or Skip", 1]] },
  { id: "start", name: "Home → Start → transition", verdict: "1 tap",
    steps: [["home", "Open the app", 0], ["w-checkin", "Tap Start (card morphs into the workout)", 1]] },
  { id: "sets", name: "Check-in → set → rest → next set", verdict: "1 tap per set · first set 2 taps after Start",
    steps: [["w-checkin", "From Start", 0], ["w-set1", "Tap Good (warm-up card on top)", 1], ["w-rest", "Tap Log set 1 (warm-up folds, rest starts)", 1], ["w-set2", "Wait, or tap Skip rest", 0], ["w-rest2", "Tap Log set 2", 1], ["w-set1-short", "Variant: tap Rough at check-in", 0]] },
  { id: "interrupt", name: "Interruption: lock mid-rest", verdict: "0 taps to recover",
    steps: [["w-rest", "Resting after set 1", 0], ["w-lock", "Press the side button", 0], ["w-reopen", "Unlock and open Uptime", 0], ["w-resume-long", "Variant: reopen after more than 90 min", 0], ["home-partial", "Variant: never finished, opened the next day", 0]] },
  { id: "swap", name: "Swap an exercise", verdict: "2 taps",
    steps: [["w-set1", "On the set screen", 0], ["w-swap", "Tap Swap", 1], ["w-set-swapped", "Tap Dumbbell floor press", 1]] },
  { id: "finish", name: "Finish and see the summary", verdict: "2 taps (last set, Done)",
    steps: [["w-last", "On the last set", 0], ["w-summary", "Tap Log last set", 1], ["home-after", "Tap Done", 1]] },
  { id: "return", name: "Back after a 10-day gap", verdict: "Same taps as any day",
    steps: [["home-return", "Open the app on 6 Dec", 0], ["w-checkin-lb", "Tap Start", 1], ["w-set-return", "Tap Good", 1]] },
  { id: "busy", name: "Busy mode", verdict: "On: 2 taps (Plan) · Off: 1 tap (Home)",
    steps: [["home", "On Home", 0], ["plan", "Tap Plan", 1], ["plan-busy-on", "Tap the Busy mode switch", 1], ["home-busy", "Tap Home", 1], ["home-busy-off", "Tap Turn off in the banner", 1], ["home-busy-suggest", "Variant: two packed weeks in a row", 0]] },
  { id: "sport", name: "Log an unplanned sport session", verdict: "2 taps",
    steps: [["home", "On Home", 0], ["home-sport-sheet", "Tap Log something else", 1], ["home-sport-done", "Tap Basketball (saves with defaults)", 1]] },
];

// ---------------------------------------------------------------- state + render
const S = { f: 0, i: 0, free: null, restEnd: null };
const screenEl = document.getElementById("screen");
const phoneEl = document.getElementById("phone");

function currentId() { return S.free || FLOWS[S.f].steps[S.i][0]; }

function render(vt) {
  const id = currentId();
  const sc = SCREENS[id];
  if (sc.enter) sc.enter();
  const paint = () => {
    screenEl.innerHTML = sc.html();
    screenEl.classList.remove("fade-in");
    if (!vt) { void screenEl.offsetWidth; screenEl.classList.add("fade-in"); }
    tick();
  };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (vt && document.startViewTransition && !reduce) document.startViewTransition(paint); else paint();
  renderFlows(); renderNotes();
  try { history.replaceState(null, "", "#" + FLOWS[S.f].id + "-" + (S.i + 1)); } catch (e) {}
}

function renderFlows() {
  document.getElementById("flows").innerHTML = `<div class="lbl">Flows</div>` + FLOWS.map((f, k) =>
    `<button class="flowbtn" type="button" data-flow="${k}" aria-current="${k === S.f}"><span class="n">${k + 1}</span><span>${f.name}</span>${f.flag ? `<span class="f">Flag</span>` : ""}</button>`).join("");
}

function renderNotes() {
  const f = FLOWS[S.f], id = currentId(), sc = SCREENS[id];
  let cum = 0;
  const steps = f.steps.map(([s, via, taps], k) => {
    const variant = via.startsWith("Variant");
    if (!variant) cum += taps;
    const t = variant ? "variant" : `${cum} ${cum === 1 ? "tap" : "taps"}`;
    return `<li><button type="button" data-step="${k}" aria-current="${!S.free && k === S.i}"><span class="k">${k + 1}</span><span>${SCREENS[s].name}<span class="via">${via}</span></span><span class="t">${t}</span></button></li>`;
  }).join("");
  document.getElementById("notes").innerHTML = `
    <div class="panel">
      <h3>Flow ${S.f + 1} of ${FLOWS.length}</h3>
      <h2>${f.name}</h2>
      <p><span class="pill ${f.flag ? "flag" : "ok"}">${f.flag ? "Flag · " : ""}${f.verdict}</span></p>
      <ol class="steps">${steps}</ol>
      ${f.flag ? `<div class="flagbox"><b>More than 2 taps:</b> ${f.flag}</div>` : ""}
    </div>
    <div class="panel">
      <h3>This screen</h3>
      <h2>${sc.name}</h2>
      <dl class="kv" style="margin:8px 0 0">
        <dt>Primary action</dt><dd><b>${sc.primary}</b></dd>
        <dt>Why it's there</dt><dd>${sc.why}</dd>
      </dl>
      ${sc.more ? `<h3>Also</h3><ul>${sc.more.map(m => `<li>${m}</li>`).join("")}</ul>` : ""}
      ${S.free ? `<p class="small muted" style="margin-top:10px">Off the flow's path. Use the flow list or Back to return.</p>` : ""}
    </div>`;
  const last = f.steps.length - 1;
  document.getElementById("prev").disabled = !S.free && S.i === 0 && S.f === 0;
  document.getElementById("next").disabled = !S.free && S.i === last && S.f === FLOWS.length - 1;
  document.getElementById("stepLabel").textContent = S.free ? "off path" : `step ${S.i + 1} of ${f.steps.length}`;
}

function go(id, vt) {
  if (!SCREENS[id]) return;
  const f = FLOWS[S.f];
  let i = f.steps.findIndex((st, k) => k > S.i && st[0] === id);
  if (i < 0) i = f.steps.findIndex(st => st[0] === id);
  if (i >= 0) { S.i = i; S.free = null; }
  else {
    const fi = FLOWS.findIndex(fl => fl.steps.some(st => st[0] === id));
    const own = FLOWS[S.f].steps.some(st => st[0] === currentId());
    if (fi >= 0 && !own) { S.f = fi; S.i = FLOWS[fi].steps.findIndex(st => st[0] === id); S.free = null; }
    else S.free = id;
  }
  render(vt);
}

function step(d) {
  if (S.free) { S.free = null; return render(); }
  const f = FLOWS[S.f];
  if (S.i + d >= 0 && S.i + d < f.steps.length) S.i += d;
  else if (d > 0 && S.f < FLOWS.length - 1) { S.f++; S.i = 0; }
  else if (d < 0 && S.f > 0) { S.f--; S.i = FLOWS[S.f].steps.length - 1; }
  render();
}

function tick() {
  const els = screenEl.querySelectorAll("[data-rest]");
  if (!els.length || !S.restEnd) return;
  const ms = S.restEnd - Date.now();
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  els.forEach(el => {
    if (ms > 0) { el.textContent = fmt(Math.ceil(ms / 1000)); el.classList.remove("over"); }
    else { el.textContent = `Rest over · ${fmt(Math.floor(-ms / 1000))} ago`; el.classList.add("over"); }
  });
}
setInterval(tick, 250);

// ---------------------------------------------------------------- events
screenEl.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if (t && t.dataset.go) go(t.dataset.go, t.hasAttribute("data-vt"));
});
document.getElementById("flows").addEventListener("click", e => {
  const b = e.target.closest("[data-flow]"); if (!b) return;
  S.f = +b.dataset.flow; S.i = 0; S.free = null; render();
});
document.getElementById("notes").addEventListener("click", e => {
  const b = e.target.closest("[data-step]"); if (!b) return;
  S.i = +b.dataset.step; S.free = null; render();
});
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
const hot = document.getElementById("hotToggle"), thumb = document.getElementById("thumbToggle");
const applyToggles = () => { document.body.classList.toggle("showhot", hot.checked); phoneEl.classList.toggle("thumb", thumb.checked); };
hot.onchange = thumb.onchange = applyToggles;

// Deep link: #sets-3
(function init() {
  const m = /^#([a-z]+)-(\d+)$/.exec(location.hash || "");
  if (m) { const fi = FLOWS.findIndex(f => f.id === m[1]); if (fi >= 0) { S.f = fi; S.i = Math.min(+m[2] - 1, FLOWS[fi].steps.length - 1); } }
  applyToggles(); render();
})();
</script>
</body>
</html>
